<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Advising Appointment</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">

    <h1>Advising Appointment</h1>
    <form action="thankyou.html" method="get">

      <fieldset>
        <legend>Contact Info</legend>
        <label for="firstName">First Name: </label>
        <input type="text" name="First_Name" id="firstName" required placeholder="Put your first name here" autofocus>

        <label for="lastName">Last Name: </label>
        <input type="text" name="Last_Name" id="lastName" required placeholder="Put your last name here">

        <label for="email">Email Address: </label>
        <input type="text" name="Email" id="email" required placeholder="Put your email here">
      </fieldset>


      <select name="contact" id="">
        <option value="email">Email</option>
        <option value="text">Text Message</option>
        <option value="owl">Owl</option>
      </select>


      <input type="submit" value="Submit">
    </form>

  </main>
</body>

</html>
